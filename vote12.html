<!DOCTYPE html>
<html>
<head>
    <title>Cast Your Vote</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .video-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 75%; /* 4:3 Aspect Ratio */
            height: 0;
        }

        .video-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            text-align: center;
            font-weight: bold;
            z-index: 2;
        }

        #voting-section {
            display: none;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .candidates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .candidate-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s;
            cursor: pointer;
            border: 2px solid #e0e0e0;
            position: relative;
            overflow: hidden;
        }

        .candidate-card:hover {
            transform: translateY(-5px);
            border-color: #007bff;
        }

        .candidate-card.selected {
            border-color: #28a745;
            background-color: #f8fff8;
        }

        .candidate-name {
            font-size: 1.2em;
            font-weight: bold;
            margin: 10px 0;
            color: #333;
        }

        .vote-button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        .vote-button:hover {
            background-color: #0056b3;
        }

        .candidate-icon {
            font-size: 3em;
            color: #007bff;
            margin-bottom: 10px;
        }

        .verification-status {
            text-align: center;
            font-size: 1.2em;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 5px;
        }

        .status-success {
            background-color: #d4edda;
            color: #155724;
        }

        .status-error {
            background-color: #f8d7da;
            color: #721c24;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="video-section">
            <div class="video-container">
                <div class="video-wrapper">
                    <img id="video-feed" src="{{ url_for('video_feed_cast_vote') }}" alt="Video feed">
                    <div id="status-overlay" class="status-overlay">Verifying Face...</div>
                </div>
            </div>
        </div>

        <div id="voting-section">
            <div class="verification-status status-success">
                <i class="fas fa-check-circle"></i> Face Verified Successfully
            </div>
            
            <div class="candidates-grid">
                {% for candidate in candidates %}
                <div class="candidate-card" onclick="selectCandidate(this, '{{ candidate }}')">
                    <div class="candidate-icon">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <div class="candidate-name">{{ candidate }}</div>
                    <button class="vote-button" onclick="submitVote(this, '{{ candidate }}')">
                        Vote for {{ candidate }}
                    </button>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <script>
        let selectedCard = null;

        function selectCandidate(card, candidate) {
            if (selectedCard) {
                selectedCard.classList.remove('selected');
            }
            card.classList.add('selected');
            selectedCard = card;
        }

        function submitVote(button, candidate) {
            if (!confirm(`Are you sure you want to vote for ${candidate}?`)) {
                return;
            }

            // Disable all vote buttons to prevent double voting
            const allButtons = document.querySelectorAll('.vote-button');
            allButtons.forEach(btn => btn.disabled = true);

            // Update clicked button UI
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';

            const formData = new FormData();
            formData.append('vote', candidate);

            // Add retry mechanism
            const maxRetries = 3;
            let currentRetry = 0;

            function trySubmitVote() {
                fetch('/submit_vote', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    credentials: 'same-origin'
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.status === 'success') {
                        // Show success message before redirect
                        const votingSection = document.getElementById('voting-section');
                        votingSection.innerHTML = `
                            <div class="verification-status status-success" style="font-size: 1.5em; padding: 20px;">
                                <i class="fas fa-check-circle"></i> Vote Successfully Cast!
                                <p style="font-size: 0.8em; margin-top: 10px;">Redirecting...</p>
                            </div>`;
                        
                        setTimeout(() => {
                            window.location.href = data.redirect;
                        }, 1500);
                    } else {
                        throw new Error(data.message || 'Vote submission failed');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    currentRetry++;
                    
                    if (currentRetry < maxRetries) {
                        // Show retry message
                        button.innerHTML = `<i class="fas fa-sync"></i> Retrying... (${currentRetry}/${maxRetries})`;
                        setTimeout(trySubmitVote, 1000); // Wait 1 second before retry
                    } else {
                        // Reset all buttons if all retries failed
                        allButtons.forEach(btn => {
                            btn.disabled = false;
                            btn.innerHTML = `Vote for ${btn.parentElement.querySelector('.candidate-name').textContent}`;
                        });
                        
                        // Show error message with more details
                        const errorMessage = error.message === 'Vote submission failed' ?
                            'Unable to submit your vote. Please try again or contact support if the problem persists.' :
                            `Error: ${error.message}. Please try again.`;
                        
                        alert(errorMessage);
                    }
                });
            }

            // Start the submission process
            trySubmitVote();
        }

        let verificationInterval;

        function checkVoterStatus() {
            fetch('/verify_voter')
                .then(response => response.json())
                .then(data => {
                    const statusOverlay = document.getElementById('status-overlay');
                    const votingSection = document.getElementById('voting-section');
                    
                    statusOverlay.textContent = data.status;
                    
                    if (data.status === 'Face Verified' && data.can_vote) {
                        statusOverlay.style.color = '#00ff00';
                        votingSection.style.display = 'block';
                        // Keep video section visible for continuous verification
                        statusOverlay.textContent = 'Face Verified - Please Cast Your Vote';
                    } else if (data.status === 'Already Voted') {
                        statusOverlay.style.color = '#ff0000';
                        votingSection.style.display = 'none';
                        clearInterval(verificationInterval);
                        alert('You have already voted. Redirecting to home page...');
                        setTimeout(() => window.location.href = '/', 2000);
                    } else if (data.status === 'Face Does Not Match') {
                        statusOverlay.style.color = '#ff0000';
                        votingSection.style.display = 'none';
                        // Keep checking for face match
                    } else if (data.status.includes('Error')) {
                        statusOverlay.style.color = '#ff0000';
                        clearInterval(verificationInterval);
                        setTimeout(() => location.reload(), 3000);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    const statusOverlay = document.getElementById('status-overlay');
                    statusOverlay.textContent = 'Connection error. Please refresh the page.';
                    statusOverlay.style.color = '#ff0000';
                    clearInterval(verificationInterval);
                });
        }

        function startVerification() {
            // Show video section if hidden
            const videoSection = document.querySelector('.video-section');
            const videoFeed = document.getElementById('video-feed');
            const statusOverlay = document.getElementById('status-overlay');
            
            videoSection.style.display = 'block';
            statusOverlay.textContent = 'Verifying Face...';
            
            // Ensure video feed is loaded
            videoFeed.onload = function() {
                console.log('Video feed loaded');
                verificationInterval = setInterval(checkVoterStatus, 1000);
            };
            
            videoFeed.onerror = function() {
                console.error('Video feed failed to load');
                statusOverlay.textContent = 'Camera error. Please refresh the page.';
                statusOverlay.style.color = '#ff0000';
            };
            
            // Set video feed source
            videoFeed.src = "{{ url_for('video_feed_cast_vote') }}";
        }

        // Start verification when page loads
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(startVerification, 1000); // Give a small delay for page to fully load
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (verificationInterval) {
                clearInterval(verificationInterval);
            }
        });
    </script>
</body>
</html>
